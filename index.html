<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f6f4f">
<title>The Fridge List</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="src/ui/styles.css">
</head>
<body>
<div id="app"></div>
<script type="module">
  import { mount, failure } from './src/ui/main.js';

  // First, so that if this version cannot start, the next one can still
  // arrive and replace it.
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }

  // No storage passed: the app chooses its own backend from this device's
  // settings (OneDrive once connected, otherwise local only). Nothing above
  // src/data/ knows which one it got.
  const root = document.getElementById('app');
  try {
    window.app = await mount(root);
  } catch (err) {
    console.error(err);
    root.replaceChildren(failure(err));
  }
</script>
</body>
</html>
